# Publishes the linux agent binary and its checksum. Run it by pushing a version tag, for example: git tag v1.0.0 && git push origin v1.0.0
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: agent-linux
      - uses: actions/checkout@v4
        with:
          repository: Wearden/proto
          path: proto
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        run: |
          go work init ./proto ./agent-linux
          go work edit -replace=github.com/Wearden/proto@v0.0.0=./proto
          go work sync
          mkdir release
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o release/wearden-agent-linux-amd64 ./agent-linux/cmd/agent
          (cd release && sha256sum wearden-agent-linux-amd64 > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
